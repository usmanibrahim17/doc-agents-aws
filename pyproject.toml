[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: modern syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"evals/run_evals.py" = ["E501"] # Markdown table rows in the report template

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests do `from app.common import ...` without installing the project.
pythonpath = ["."]
